<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f5f6f8;
    --surface-1: #ffffff;
    --surface-2: #f8f9fb;
    --border: #dfe2e7;
    --grid: #eceef1;
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #6b7280;
    --accent: #2f5d8a;
    --accent-soft: #eaf0f6;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-good-bg: #e9f7e9;
    --status-good-text: #0a5c0a;
    --status-warning-bg: #fff4d6;
    --status-warning-text: #6b4800;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 56px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .subtitle { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
  h2 { color: var(--text-primary); }

  .segmented { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; max-width: 100%; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
  .segmented button {
    border: 0; border-radius: 7px; padding: 7px 14px; min-height: 34px;
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .segmented button:hover { color: var(--text-primary); background: var(--surface-2); }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; }
  button.kpi { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  button.kpi:hover { border-color: var(--text-muted); }
  button.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .kpi-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
  .kpi-value { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; text-align: right; }
  .kpi-value small { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .kpi-delta { margin-top: 6px; font-size: 13px; color: var(--text-secondary); text-align: right; }
  .kpi-delta b { color: var(--text-primary); font-weight: 600; }

  .checks { margin-bottom: 20px; }
  .checks h2 { margin: 0 0 14px; font-size: 16px; }
  .check-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .check { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--grid); border-left-width: 4px; border-radius: 10px; min-width: 0; }
  .check.ok { border-left-color: var(--status-good); }
  .check.warn { border-left-color: var(--status-warning); }
  .check-icon {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
  }
  .check-icon.ok { background: var(--status-good); }
  .check-icon.warn { background: var(--status-warning); color: #111827; }
  .check-title { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
  .check-status { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .check-status.ok { background: var(--status-good-bg); color: var(--status-good-text); }
  .check-status.warn { background: var(--status-warning-bg); color: var(--status-warning-text); }
  .check-detail { margin-top: 6px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
  .legend .spike-key { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--status-warning); background: transparent; }

  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .chart-head h2 { margin: 0; font-size: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 8px; font-size: 13px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis-label { fill: var(--text-muted); font-size: 12px; }
  .end-label { font-size: 12px; font-weight: 600; fill: var(--text-secondary); }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    min-width: 150px; padding: 10px 12px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: 13px;
  }
  .tooltip .t-title { color: var(--text-secondary); margin-bottom: 6px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tooltip .t-row span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .tooltip .t-row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .axis-label.active { fill: var(--text-primary); font-weight: 700; }
  .point-label { font-size: 12px; font-weight: 600; fill: var(--text-primary); paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; }
  .chart-hint { margin: 0 0 4px; font-size: 12px; color: var(--text-muted); }

  .detail { margin-top: 20px; }
  .detail h2 { margin: 0 0 14px; font-size: 16px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 13px; text-align: left; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.code, th.code { color: var(--text-muted); white-space: nowrap; width: 1%; }
  td.name { min-width: 120px; }
  .lead-inline { display: none; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
  tr.account-row { cursor: pointer; }
  tr.account-row:hover td { background: var(--surface-2); }
  tr.account-row[aria-expanded="true"] td { background: var(--accent-soft); }
  tr.account-row .caret { display: inline-block; width: 16px; color: var(--text-muted); }
  tr.vendor-row td { background: var(--surface-2); font-size: 13px; padding-top: 9px; padding-bottom: 9px; }
  tr.vendor-row td.vendor-name { padding-left: 28px; }
  tr.vendor-head td { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  tr.vendor-others td { color: var(--text-secondary); }

  @media (max-width: 760px) {
    main { padding-top: 20px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 16px 14px; }
    .kpi-value { font-size: 20px; }
    .check-list { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .segmented button { padding: 7px 11px; font-size: 13px; }
    /* SVG는 축소되므로 사용자 단위 글자를 키워 화면상 크기를 유지 */
    .axis-label, .end-label, .point-label { font-size: 26px; }
    /* 좁은 화면: 계정코드·순위 열을 이름 칸 안으로 옮겨 열 수를 줄임 */
    table { font-size: 12.5px; }
    th, td { padding: 10px 6px; }
    th { white-space: normal; }
    .col-lead { display: none; }
    .lead-inline { display: block; font-size: 11.5px; color: var(--text-muted); }
    td.name { min-width: 96px; }
    tr.vendor-row td { font-size: 12px; }
    tr.vendor-row td.vendor-name { padding-left: 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>손익 대시보드</h1>
      <p class="subtitle">분개장 기준 · 단위 억원</p>
    </div>
    <div class="segmented" id="year-buttons" role="group" aria-label="연도 선택"></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card checks">
    <h2 id="checks-title">이상징후 점검</h2>
    <div class="check-list" id="check-list"></div>
  </section>

  <section class="card">
    <div class="chart-head">
      <h2 id="chart-title">월별 추이</h2>
      <div class="segmented" id="metric-buttons" role="group" aria-label="지표 선택"></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="chart-hint" id="chart-hint"></p>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" viewBox="0 0 960 360" role="img" aria-label="월별 추이 선 차트"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </section>

  <section class="card detail">
    <h2 id="detail-title">상세</h2>
    <div class="table-scroll">
      <table>
        <thead id="detail-head"></thead>
        <tbody id="detail-body"></tbody>
        <tfoot id="detail-foot"></tfoot>
      </table>
    </div>
  </section>
</main>

const ANOMALY_RULES = {
  weekendShareMax: 0.05,   // 주말 전표 비중 상한
  spikeRatio: 1.5,         // 월 금액 / 평월(중앙값) 상한
  top1ShareMax: 0.20,      // 매출 상위 1개사 비중 상한
  top10ShareMax: 0.75,     // 매출 상위 10개사 비중 상한
};

// month: null이면 연간 전체, 1~12면 해당 월 선택

const state = { year: DATA.length ? DATA[DATA.length - 1].year : null, metric: "revenue", month: null, openAccount: null };

// 색은 연도(엔티티)에 고정: 정렬된 DATA 순서대로 슬롯을 배정

const byYear = (year) => DATA.find(d => d.year === year);
const toEok = (v) => v / 1e8;
const fmtEok = (v, digits = 1) =>
  toEok(v).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });

function renderButtons(containerId, items, isActive, onClick) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = item.label;
    btn.setAttribute("aria-pressed", String(isActive(item)));
    btn.addEventListener("click", () => onClick(item));
    box.appendChild(btn);
  });
}

function changeText(value, base) {
  if (base === undefined || base === null || base === 0) return null;
  const pct = (value - base) / Math.abs(base) * 100;
  const arrow = pct > 0 ? "▲" : pct < 0 ? "▼" : "–";
  return `${arrow} ${Math.abs(pct).toFixed(1)}%`;
}

function renderKpis() {
  const cur = byYear(state.year);
  const prev = byYear(state.year - 1);
  const box = document.getElementById("kpis");
  box.innerHTML = METRICS.map(m => {
    const value = cur.total[m.key];
    let delta = `<span>전기 데이터 없음</span>`;
    if (prev) {
      const change = changeText(value, prev.total[m.key]);
      if (change) delta = `<b>${change}</b> 전기(${prev.year}) 대비`;
    }
    return `<button type="button" class="card kpi" data-metric="${m.key}" aria-pressed="${m.key === state.metric}">
      <div class="kpi-label">${m.label}</div>
      <div class="kpi-value">${fmtEok(value)}<small>억원</small></div>
      <div class="kpi-delta">${delta}</div>
    </button>`;
  }).join("");
  box.querySelectorAll("button.kpi").forEach(btn =>
    btn.addEventListener("click", () => { state.metric = btn.dataset.metric; render(); }));
}

function median(values) {
  const s = [...values].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// 평월(중앙값)의 spikeRatio배를 넘는 달 (1~12). 중앙값이 0 이하이면 비교하지 않음
function spikeInfo(yearData, metricKey) {
  const values = yearData.monthly.map(row => row[metricKey]);
  const med = median(values);
  const months = med > 0
    ? values.map((v, i) => ({ month: i + 1, ratio: v / med })).filter(m => m.ratio > ANOMALY_RULES.spikeRatio)
    : [];
  return { median: med, months };
}

function renderChecks() {
  const cur = byYear(state.year);

  const weekendShare = cur.entries.total ? cur.entries.weekend / cur.entries.total : 0;
  const spike = spikeInfo(cur, metric.key);
  const rv = cur.revenue_vendors;
  const revTotal = rv.top.reduce((s, t) => s + t.amount, 0) + rv.others_amount;

  const top10 = revTotal ? rv.top.reduce((s, t) => s + t.amount, 0) / revTotal : 0;

  const items = [

    },
    {

      warn: spike.months.length > 0,
      detail: (spike.median > 0
        ? `평월(중앙값) ${fmtEok(spike.median)}억 · 기준 ${ANOMALY_RULES.spikeRatio}배 이하`
        : "중앙값이 0 이하라 비교 제외") +
        (spike.months.length
          ? `<br>급증: ${spike.months.map(m => `${m.month}월(${m.ratio.toFixed(1)}배)`).join(", ")}`
          : ""),
    },
    {
      title: "매출 거래처 집중도",
      warn: top1 > ANOMALY_RULES.top1ShareMax || top10 > ANOMALY_RULES.top10ShareMax,
      detail: `상위 1개사 ${pct(top1)} (기준 ${pct(ANOMALY_RULES.top1ShareMax)} 이하)<br>` +
        `상위 10개사 ${pct(top10)} (기준 ${pct(ANOMALY_RULES.top10ShareMax)} 이하)`,

  ];
  document.getElementById("check-list").innerHTML = items.map(it => `<div class="check ${it.warn ? "warn" : "ok"}">

// 선택 연도·월 기준 계정과목별 금액 (월 미선택이면 연간)
function accountRows(yearData, metricKey) {
  if (!yearData) return null;
  const pick = (a) => state.month ? a.monthly[state.month - 1] : a.total;
  if (metricKey === "operating_income") {
    const sum = (key) => yearData.accounts[key].reduce((s, a) => s + pick(a), 0);
    return [
      { code: "", name: "매출", amount: sum("revenue") },
      { code: "", name: "(−) 매출원가", amount: -sum("cogs") },
      { code: "", name: "(−) 판관비", amount: -sum("sga") },
    ];
  }
  return yearData.accounts[metricKey].map(a => ({
    code: a.code, name: a.name, amount: pick(a),
    vendors: state.month ? a.top_vendors.monthly[state.month - 1] : a.top_vendors.total,
  }));
}

function vendorRows(r, fmtWon) {
  const v = r.vendors;
  const share = (amt) => r.amount ? `${(amt / r.amount * 100).toFixed(1)}%` : "–";
  if (!v.top.length) {
    return `<tr class="vendor-row"><td class="col-lead"></td><td class="vendor-name" colspan="4">해당 기간 거래처 없음</td></tr>`;
  }
  let html = `<tr class="vendor-row vendor-head"><td class="col-lead">순위</td><td class="vendor-name">거래처명</td>
    <td class="num">금액(원)</td><td class="num">계정 내 비중</td><td></td></tr>`;
  html += v.top.map((t, i) => `<tr class="vendor-row">
    <td class="code col-lead">${i + 1}위</td>
    <td class="vendor-name"><span class="lead-inline">${i + 1}위</span>${t.name}</td>
    <td class="num">${fmtWon(t.amount)}</td><td class="num">${share(t.amount)}</td><td></td></tr>`).join("");
  if (v.others_count) {
    html += `<tr class="vendor-row vendor-others">
      <td class="col-lead"></td><td class="vendor-name">기타 ${v.others_count.toLocaleString("ko-KR")}개사</td>
      <td class="num">${fmtWon(v.others_amount)}</td><td class="num">${share(v.others_amount)}</td><td></td></tr>`;
  }
  return html;
}

function renderDetail() {
  const metric = METRICS.find(m => m.key === state.metric);
  const isOI = metric.key === "operating_income";
  const period = state.month ? `${state.year}년 ${state.month}월` : `${state.year}년`;

  const change = (v, key) => (prevRows && changeText(v, prevByKey.get(key))) || "–";

  document.getElementById("detail-title").textContent =

    return `<tr${attrs}>

      <td class="num">${change(r.amount, r.code || r.name)}</td></tr>` +
      (open ? vendorRows(r, fmtWon) : "");
  }).join("");
  body.querySelectorAll("tr.account-row").forEach(tr => tr.addEventListener("click", () => {
    state.openAccount = state.openAccount === tr.dataset.code ? null : tr.dataset.code;

  const prevTotal = prevRows ? prevRows.reduce((s, r) => s + r.amount, 0) : null;
  document.getElementById("detail-foot").innerHTML = `<tr>

    <td class="num">${(prevRows && changeText(total, prevTotal)) || "–"}</td></tr>`;
}

function niceTicks(min, max, count = 5) {
  if (min === max) { max = min + 1; }
  const raw = (max - min) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  return ticks;
}

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (parent) parent.appendChild(node);
  return node;
}

function renderChart() {
  const metric = METRICS.find(m => m.key === state.metric);
  document.getElementById("chart-title").textContent = `월별 ${metric.label} 추이 (억원)`;
  const spikes = spikeInfo(byYear(state.year), metric.key).months;
  document.getElementById("legend").innerHTML = DATA.map(d =>
    `<span><i style="background:${colorOf(d.year)}"></i>${d.year}년</span>`).join("") +
    (spikes.length ? `<span><i class="spike-key"></i>${state.year}년 급증월 (평월 ${ANOMALY_RULES.spikeRatio}배 초과)</span>` : "");
  document.getElementById("chart-hint").textContent = state.month
    ? `${state.month}월 선택됨 · 같은 달을 다시 클릭하면 연간 전체로 돌아갑니다`
    : "월을 클릭하면 그 달을 강조합니다";

  const svg = document.getElementById("chart");
  svg.innerHTML = "";
  const W = 960, H = 360, M = { top: 16, right: 64, bottom: 32, left: 56 };
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;

  const series = DATA.map(d => ({
    year: d.year,
    values: d.monthly.map(row => toEok(row[metric.key])),
  }));
  const all = series.flatMap(s => s.values);
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all));
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const x = (i) => M.left + (iw * i) / 11;
  const y = (v) => M.top + ih - ((v - yMin) / (yMax - yMin)) * ih;

  ticks.forEach(t => {
    el("line", { x1: M.left, x2: M.left + iw, y1: y(t), y2: y(t),
      stroke: t === 0 ? "var(--text-muted)" : "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: M.left - 10, y: y(t) + 4, "text-anchor": "end", class: "axis-label" }, svg)
      .textContent = t.toLocaleString("ko-KR");
  });
  const sel = state.month ? state.month - 1 : null;
  if (sel !== null) {
    const bw = iw / 11 * 0.7;
    el("rect", { x: x(sel) - bw / 2, y: M.top, width: bw, height: ih, rx: 4,
      fill: "var(--accent)", opacity: 0.1 }, svg);
  }
  for (let i = 0; i < 12; i++) {
    el("text", { x: x(i), y: H - 8, "text-anchor": "middle",
      class: i === sel ? "axis-label active" : "axis-label" }, svg)
      .textContent = `${i + 1}월`;
  }

  const crosshair = el("line", { y1: M.top, y2: M.top + ih, stroke: "var(--text-muted)",
    "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" }, svg);

  // 선택 연도를 마지막에 그려 위로 올림
  const ordered = [...series].sort((a, b) => (a.year === state.year) - (b.year === state.year));
  ordered.forEach(s => {
    const active = s.year === state.year;
    const g = el("g", { opacity: active ? 1 : 0.55 }, svg);
    el("path", {
      d: s.values.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(""),
      fill: "none", stroke: colorOf(s.year), "stroke-width": active ? 2.5 : 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
    }, g);
    s.values.forEach((v, i) => el("circle", { cx: x(i), cy: y(v), r: i === sel ? 7 : 4,
      fill: colorOf(s.year), stroke: "var(--surface-1)", "stroke-width": 2 }, g));
    el("text", { x: x(11) + 10, y: y(s.values[11]) + 4, class: "end-label" }, g)
      .textContent = `${s.year}`;
  });
  const selSeries = series.find(s => s.year === state.year);
  spikes.forEach(({ month }) => {
    const i = month - 1, v = selSeries.values[i];
    el("circle", { cx: x(i), cy: y(v), r: 11, fill: "none",
      stroke: "var(--status-warning)", "stroke-width": 2.5 }, svg);
    el("text", { x: x(i), y: y(v) - 17, "text-anchor": "middle", class: "point-label" }, svg)
      .textContent = "급증";
  });
  if (sel !== null) {
    ordered.forEach(s => {
      el("text", { x: x(sel) + 12, y: y(s.values[sel]) + 4, class: "point-label" }, svg)
        .textContent = `${s.values[sel].toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}억`;
    });
  }

  const tooltip = document.getElementById("tooltip");
  const wrap = document.getElementById("chart-wrap");
  const hit = el("rect", { x: M.left - 20, y: M.top, width: iw + 40, height: ih + M.bottom,
    fill: "transparent", style: "cursor:pointer" }, svg);
  const monthAt = (e) => {
    const rect = svg.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    return Math.max(0, Math.min(11, Math.round(((sx - M.left) / iw) * 11)));
  };
  hit.addEventListener("click", (e) => {
    const m = monthAt(e) + 1;
    state.month = state.month === m ? null : m;
    render();
  });
  hit.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    const i = monthAt(e);
    crosshair.setAttribute("x1", x(i));
    crosshair.setAttribute("x2", x(i));
    crosshair.setAttribute("visibility", "visible");
    tooltip.innerHTML = `<div class="t-title">${i + 1}월 ${metric.label}</div>` +
      [...series].reverse().map(s => `<div class="t-row">
        <span><i style="background:${colorOf(s.year)}"></i>${s.year}년</span>
        <b>${s.values[i].toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}억</b>
      </div>`).join("");
    tooltip.style.display = "block";
    const px = (x(i) / W) * rect.width;
    const left = px + 14 + tooltip.offsetWidth > wrap.clientWidth ? px - 14 - tooltip.offsetWidth : px + 14;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${(M.top / H) * rect.height}px`;
  });
  hit.addEventListener("mouseleave", () => {
    crosshair.setAttribute("visibility", "hidden");
    tooltip.style.display = "none";
  });
}

function render() {
  renderButtons("year-buttons", DATA.map(d => ({ year: d.year, label: `${d.year}년` })),
    item => item.year === state.year, item => { state.year = item.year; render(); });
  renderButtons("metric-buttons", METRICS,
    item => item.key === state.metric, item => { state.metric = item.key; render(); });
  renderKpis();
  renderChecks();
  renderChart();
  renderDetail();
}

if (DATA.length) render();
</script>
</body>
</html>
